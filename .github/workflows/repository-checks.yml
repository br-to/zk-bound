name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository conventions
        run: ./scripts/check-repo.sh
      - name: Lint and type-check TypeScript
        run: pnpm check
      - name: Test policy SDK
        run: pnpm --filter @zk-bound/policy-sdk test
      - name: Test demo
        run: pnpm --filter @zk-bound/demo test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry tests
        run: forge test --root contracts -vvv
